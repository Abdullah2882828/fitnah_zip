name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ["alfitnah.zip"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q alfitnah.zip -d src

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android wrapper
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$APP_URL" || { echo "Set APP_URL variable first"; exit 1; }
          mkdir apk && cd apk
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3
          mkdir www assets
          echo '<!doctype html><title>الفطنة</title>' > www/index.html
          cp ../src/alfitnah/public/logo.png assets/icon-only.png || true
          cat > capacitor.config.json <<EOF
          {"appId":"com.alfitnah.app","appName":"الفطنة","webDir":"www",
           "server":{"url":"$APP_URL","cleartext":false}}
          EOF
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' || true
          npx cap sync android

      - name: Build debug APK
        run: |
          cd apk/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp apk/android/app/build/outputs/apk/debug/app-debug.apk Alfitnah.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: الفطنة APK ${{ github.run_number }}
          files: Alfitnah.apk
